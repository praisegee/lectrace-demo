[project]
name = "lectrace-demo"
version = "0.1.0"
description = "LecTrace demo lectures"
requires-python = ">=3.11,<3.13"
dependencies = [
    "lectrace>=1.1.30",
    "torch>=2.0",
    "numpy>=1.24",
    "matplotlib>=3.7",
]

[tool.uv]
package = false

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cpu" }

[dependency-groups]
dev = [
    "imageio-ffmpeg>=0.6.0",
]
